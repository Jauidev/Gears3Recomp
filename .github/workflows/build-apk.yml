name: Build Gears 3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK, NDK 27.2 & CMake 3.31
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-34
            build-tools;36.0.0
            ndk;27.2.12479018
            cmake;3.31.6

      - name: Prepare Linux compatibility shims
        run: |
          sudo ln -sf /usr/bin/python3 /usr/local/bin/py
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          sed -i 's/pwd -W/pwd/g' tools/build-apk.sh
          sed -i 's/prebuilt\/windows-x86_64\/bin\/llvm-strip\.exe/prebuilt\/linux-x86_64\/bin\/llvm-strip/g' tools/build-apk.sh
          sed -i 's/d8\.bat/d8/g' tools/build-apk.sh
          sed -i 's/aapt2\.exe/aapt2/g' tools/build-apk.sh
          sed -i 's/zipalign\.exe/zipalign/g' tools/build-apk.sh
          sed -i 's/apksigner\.bat/apksigner/g' tools/build-apk.sh
          sed -i 's/\$USERPROFILE/\$HOME/g' tools/build-apk.sh

      - name: Build native Android library (arm64)
        env:
          XPORT_GAME: gears_of_war_3
          JOBS: 4
        run: bash tools/build-android.sh xportapp

      - name: Package & sign APK
        env:
          XPORT_GAME: gears_of_war_3
        run: bash tools/build-apk.sh

      - name: Upload Gears of War 3 APK
        uses: actions/upload-artifact@v4
        with:
          name: xport-gears_of_war_3-apk
          path: build/apk-gears_of_war_3/xport-gears_of_war_3.apk
          
