name: Build Gears 3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'runtime/**'
      - 'games/gears_of_war_3/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add 8GB swap space on /mnt to prevent linker OOM
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Setup Python & Windows 'py' shim for Linux
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create 'py' command wrapper & install build tools + Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            -o Acquire::http::Timeout="15" \
            -o Acquire::Retries="5" \
            ninja-build clang lld unzip curl zstd wine wine32:i386
          pip install gdown capstone pefile
          printf '#!/usr/bin/env bash\nif [ "$1" = "-3" ]; then shift; fi\nexec python3 "$@"\n' | sudo tee /usr/local/bin/py > /dev/null
          sudo chmod +x /usr/local/bin/py

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK 27.2 (with CMake 3.31.6)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.31.6'

      - name: Set NDK & SDK environment variables
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmake/3.31.6/bin:$PATH" >> $GITHUB_ENV

      - name: Download default.xex + default.xexp and apply TU6 patch
        env:
          XEX_URL: ${{ secrets.XEX_DOWNLOAD_URL }}
        run: |
          if [ -z "$XEX_URL" ]; then
            echo "::error::El secreto XEX_DOWNLOAD_URL esta vacio o no existe."
            exit 1
          fi
          mkdir -p work_xex output_xex
          gdown "$XEX_URL" -O work_xex/xex.zip
          unzip -o work_xex/xex.zip -d work_xex/
          XEX_FILE=$(find work_xex -iname "default.xex" | head -n 1)
          XEXP_FILE=$(find work_xex -iname "default.xexp" | head -n 1)
          XEXTOOL_EXE=$(find work_xex -iname "xextool.exe" | head -n 1)
          if [ -z "$XEX_FILE" ]; then
            echo "::error::No se encontro default.xex dentro del ZIP descargado."
            exit 1
          fi
          [ "$XEX_FILE" != "work_xex/default.xex" ] && cp "$XEX_FILE" work_xex/default.xex
          if [ -n "$XEXP_FILE" ] && [ -n "$XEXTOOL_EXE" ]; then
            echo "Applying TU6 patch with bundled XexTool..."
            WINEDEBUG=-all wine "$XEXTOOL_EXE" -e u -c u -o work_xex/default_patched.xex -p "$XEXP_FILE" work_xex/default.xex
            mv work_xex/default_patched.xex work_xex/default.xex
          fi
          cp work_xex/default.xex output_xex/default.xex

      - name: Build host tools (XenonRecomp, XenonAnalyse, xexinfo) into bin/*.exe
        run: |
          mkdir -p bin
          cmake -S third_party/XenonRecomp -B build-xenonrecomp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-xenonrecomp -j $(nproc)
          cp build-xenonrecomp/XenonRecomp/XenonRecomp bin/XenonRecomp.exe
          cp build-xenonrecomp/XenonAnalyse/XenonAnalyse bin/XenonAnalyse.exe
          STATIC_LIBS=$(find build-xenonrecomp -name "*.a")
          clang++ -O2 -std=c++20 \
            -Ithird_party/XenonRecomp/XenonUtils \
            -Ithird_party/XenonRecomp/third_party/disasm \
            -Ithird_party/XenonRecomp/third_party/fmt/include \
            tools/xexinfo/xexinfo.cpp -Wl,--start-group $STATIC_LIBS -Wl,--end-group -o bin/xexinfo.exe
          chmod +x bin/*.exe
          ./bin/xexinfo.exe work_xex/default.xex | tee xexinfo_out.txt

      - name: Run port.py, sync TU6 entry point & apply POCO F6 + Fullscreen tweaks
        run: |
          python3 tools/port.py work_xex/default.xex work_port gears_of_war_3 --no-build
          mkdir -p games/gears_of_war_3/data/shader
          python3 - << 'PYEOF'
          import os, re, subprocess

          info = open("xexinfo_out.txt", "r", encoding="utf-8", errors="ignore").read()
          m_ep = re.search(r'[Ee]ntry\s*[Pp]oint\s*[:=]\s*0x([0-9A-Fa-f]{8})', info)
          if m_ep:
              ep_hex = m_ep.group(1).upper()
              print("Detected TU6 Entry Point:", ep_hex)
              for p in ("games/gears_of_war_3/gears_of_war_3.toml", "games/gears_of_war_3/game.cpp"):
                  if os.path.exists(p):
                      t = open(p, "r", encoding="utf-8", errors="ignore").read()
                      t = re.sub(r'(entry_point\s*=\s*0x)[0-9A-Fa-f]{8}', rf'\g<1>{ep_hex}', t)
                      t = re.sub(r'(sub_)[0-9A-Fa-f]{8}(\s*//\s*entry)', rf'\g<1>{ep_hex}\2', t)
                      open(p, "w", encoding="utf-8").write(t)

          shared_path = "games/gears_of_war_3/ppc/ppc_recomp_shared.h"
          shared = open(shared_path, "r", encoding="utf-8", errors="ignore").read() if os.path.exists(shared_path) else ""
          imp_syms = set()
          for root, _, files in os.walk("games/gears_of_war_3"):
              if "ppc" in root.split(os.sep):
                  continue
              for fn in files:
                  if fn.endswith(".h") or fn.endswith(".cpp"):
                      txt = open(os.path.join(root, fn), "r", encoding="utf-8", errors="ignore").read()
                      imp_syms.update(re.findall(r'__imp__sub_82[0-9A-Fa-f]{6}', txt))

          missing_imps = sorted(s for s in imp_syms if f"void {s}(" not in shared and f"PPC_FUNC({s})" not in shared)
          ppc0_path = "games/gears_of_war_3/ppc/ppc_recomp.0.cpp"
          if os.path.exists(ppc0_path):
              with open(ppc0_path, "a", encoding="utf-8") as f:
                  f.write("\n// TU6 shifted __imp__ fallbacks\n")
                  for s in missing_imps:
                      f.write(f'extern "C" void {s}(PPCContext&, uint8_t*) {{}}\n')

          for root, _, files in os.walk("android"):
              for fn in files:
                  if fn.endswith(".java") or fn.endswith(".kt"):
                      jp = os.path.join(root, fn)
                      jt = open(jp, "r", encoding="utf-8", errors="ignore").read()
                      if "setContentView" in jt and "LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES" not in jt:
                          if fn.endswith(".kt"):
                              cutout_code = "if (android.os.Build.VERSION.SDK_INT >= 28) { window.attributes.layoutInDisplayCutoutMode = android.view.WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES }; setContentView("
                          else:
                              cutout_code = "if (android.os.Build.VERSION.SDK_INT >= 28) { getWindow().getAttributes().layoutInDisplayCutoutMode = android.view.WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES; } setContentView("
                          jt = jt.replace("setContentView(", cutout_code)
                          open(jp, "w", encoding="utf-8").write(jt)
                          print("Enabled fullscreen cutout mode in:", jp)

          subprocess.run(["zstd", "-c"], input=b"", stdout=open("empty.zst", "wb"), check=True)
          zst = open("empty.zst", "rb").read()
          arr = ", ".join(f"0x{b:02x}" for b in zst)
          with open("games/gears_of_war_3/data/shader/shader_cache.h", "w") as f:
              f.write(f"""#pragma once
          #include <cstdint>
          #include <cstddef>
          #include <array>
          #include <string_view>

          struct FilenameBuf {{
              std::array<char, 256> buf{{}};
              constexpr FilenameBuf() = default;
              constexpr FilenameBuf(std::nullptr_t) {{}}
              constexpr FilenameBuf(const char*) {{}}
              operator char*() {{ return buf.data(); }}
              operator const char*() const {{ return buf.data(); }}
          }};

          inline std::string_view format_as(const FilenameBuf& f) {{ return f.buf.data(); }}

          struct ShaderCacheEntry {{
              uint64_t hash;
              uint32_t f1;
              uint32_t spirvOffset;
              uint32_t spirvSize;
              uint32_t lateSpirvOffset;
              uint32_t lateSpirvSize;
              uint32_t usedTextureMask;
              uint32_t f7;
              uint32_t f8;
              uint32_t specConstantsMask;
              uint32_t f10;
              FilenameBuf filename;
              uint32_t f12;
          }};

          inline constexpr uint8_t g_compressedSpirvCache[] = {{ {arr} }};
          inline constexpr size_t g_spirvCacheCompressedSize = {len(zst)};
          inline constexpr size_t g_spirvCacheDecompressedSize = 0;
          inline constexpr ShaderCacheEntry g_shaderCacheEntries[] = {{}};
          inline constexpr size_t g_shaderCacheEntryCount = 0;
          """)
          PYEOF

          cat << 'EOF' > games/gears_of_war_3/data/shader/shader_cache.cpp
          #include "shader_cache.h"
          EOF

      - name: Build native Android libs & package APK
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          NINJA_STATUS: "[%f/%t] "
        run: |
          export USERPROFILE="$HOME"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \

        
