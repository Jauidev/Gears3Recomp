name: Build Gears 3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'runtime/**'
      - 'games/gears_of_war_3/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python & Windows 'py' shim for Linux
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create 'py' command wrapper & install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang lld unzip curl
          pip install gdown capstone pefile
          echo '#!/usr/bin/env bash' | sudo tee /usr/local/bin/py
          echo 'if [ "$1" = "-3" ]; then shift; fi' | sudo tee -a /usr/local/bin/py
          echo 'exec python3 "$@"' | sudo tee -a /usr/local/bin/py
          sudo chmod +x /usr/local/bin/py

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK 27.2 (with CMake 3.31.6)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.31.6'

      - name: Set NDK & SDK environment variables
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmake/3.31.6/bin:$PATH" >> $GITHUB_ENV

      - name: Download and extract default.xex
        env:
          XEX_URL: ${{ secrets.XEX_DOWNLOAD_URL }}
        run: |
          mkdir -p work_xex
          gdown "$XEX_URL" -O work_xex/xex.zip
          unzip -o work_xex/xex.zip -d work_xex/
          XEX_FILE=$(find work_xex -iname "default.xex" | head -n 1)
          echo "Found XEX at: $XEX_FILE"
          [ "$XEX_FILE" != "work_xex/default.xex" ] && cp "$XEX_FILE" work_xex/default.xex || true

      - name: Build host tools (XenonRecomp, XenonAnalyse, xexinfo) into bin/*.exe
        run: |
          mkdir -p bin
          cmake -S third_party/XenonRecomp -B build-xenonrecomp -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-xenonrecomp -j $(nproc)
          cp build-xenonrecomp/XenonRecomp/XenonRecomp bin/XenonRecomp.exe
          cp build-xenonrecomp/XenonAnalyse/XenonAnalyse bin/XenonAnalyse.exe
          STATIC_LIBS=$(find build-xenonrecomp -name "*.a")
          clang++ -O2 -std=c++20 \
            -Ithird_party/XenonRecomp/XenonUtils \
            -Ithird_party/XenonRecomp/third_party/disasm \
            -Ithird_party/XenonRecomp/third_party/fmt/include \
            tools/xexinfo/xexinfo.cpp -Wl,--start-group $STATIC_LIBS -Wl,--end-group -o bin/xexinfo.exe
          chmod +x bin/*.exe
          ls -la bin/

      - name: Run port.py & verify generated PPC files
        run: |
          python3 tools/port.py work_xex/default.xex work_port gears_of_war_3 --no-build
          ls -la games/gears_of_war_3/ppc/ games/gears_of_war_3/data/shader/

      - name: Build native Android libs & package APK
        run: |
          export USERPROFILE="$HOME"
          chmod +x tools/*.sh
          sed -i 's/pwd -W/pwd/g' tools/build-apk.sh
          sed -i 's/\.bat//g' tools/build-apk.sh
          sed -i 's/\.exe//g' tools/build-apk.sh
          sed -i 's/windows-x86_64/linux-x86_64/g' tools/build-apk.sh
          XPORT_GAME=gears_of_war_3 bash tools/build-android.sh xportapp
          XPORT_GAME=gears_of_war_3 bash tools/build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GearsOfWar3-Android-APK
          path: '**/*.apk'
          if-no-files-found: error
          
