name: Build Gears 3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'runtime/**'
      - 'games/gears_of_war_3/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK 27.2
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.31.1'

      - name: Set NDK & SDK environment variables
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmake/3.31.1/bin:$PATH" >> $GITHUB_ENV

      - name: Download and extract default.xex
        env:
          XEX_URL: ${{ secrets.XEX_DOWNLOAD_URL }}
        run: |
          mkdir -p work_xex
          curl -L "$XEX_URL" -o work_xex/xex.zip
          unzip -o work_xex/xex.zip -d work_xex/
          find work_xex -iname "default.xex" -exec cp {} games/gears_of_war_3/ \;

      - name: Run codegen & build native Android libs
        run: |
          chmod +x tools/*.sh
          XPORT_GAME=gears_of_war_3 bash tools/build-android.sh xportapp

      - name: Package Android APK
        run: |
          XPORT_GAME=gears_of_war_3 bash tools/build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GearsOfWar3-Android-APK
          path: '**/*.apk'
          if-no-files-found: error
